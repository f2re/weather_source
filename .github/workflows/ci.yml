name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Validate machine-readable catalogue
        run: python scripts/validate_catalog.py

      - name: Validate generated source cards
        run: python scripts/generate_docs.py --check

      - name: Compile Python examples and tools
        run: python -m compileall -q examples scripts tests

      - name: Run tests
        run: pytest -q

      - name: Generate documentation pages
        run: python scripts/generate_docs.py --write

      - name: Build documentation strictly
        run: mkdocs build --strict
