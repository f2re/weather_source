name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install documentation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Validate catalogue
        run: python scripts/validate_catalog.py

      - name: Generate normalized source cards
        run: python scripts/catalog_docs.py --write

      - name: Verify generated artifacts
        run: python scripts/catalog_docs.py --verify

      - name: Build MkDocs strictly
        run: mkdocs build --strict

      - name: Upload built documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: weather-source-site-${{ github.run_id }}
          path: site
          if-no-files-found: error
          retention-days: 14

      - name: Configure publishing identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish to gh-pages branch
        run: mkdocs gh-deploy --force --no-history

      - name: Record Pages activation note
        run: |
          {
            echo "## Documentation publication"
            echo
            echo "The built site has been published to the \`gh-pages\` branch."
            echo "GitHub Pages site activation itself is a repository-admin setting and is not granted to the connected GitHub App."
            echo "Once enabled, select **Deploy from a branch → gh-pages → /(root)**."
          } >> "$GITHUB_STEP_SUMMARY"
