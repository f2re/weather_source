name: Sync generated catalogue

on:
  push:
    branches: [main]
    paths:
      - 'catalog/**/*.yaml'
      - 'catalog/schema.json'
      - 'scripts/generate_docs.py'
      - 'scripts/catalog_docs.py'
      - 'scripts/catalog_lib.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-generated-catalogue
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install generator dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Validate catalogue
        run: python scripts/validate_catalog.py

      - name: Generate committed human and agent artefacts
        run: python scripts/catalog_docs.py --write

      - name: Validate generated documentation
        run: |
          python scripts/catalog_docs.py --verify
          mkdocs build --strict

      - name: Commit generated artefacts
        shell: bash
        run: |
          if git diff --quiet -- \
            docs/sources/index.md \
            docs/sources/index.ru.md \
            docs/sources/index.en.md \
            docs/sources/generated \
            docs/sources/categories \
            catalog/sources.json \
            catalog/sources.ndjson \
            catalog/agent-index.json \
            llms.txt; then
            echo 'Generated catalogue is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/sources/index.md \
            docs/sources/index.ru.md \
            docs/sources/index.en.md \
            docs/sources/generated \
            docs/sources/categories \
            catalog/sources.json \
            catalog/sources.ndjson \
            catalog/agent-index.json \
            llms.txt
          git commit -m 'docs: sync generated weather source catalogue [skip ci]'
          git push origin HEAD:main
